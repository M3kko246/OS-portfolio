name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/build-tokens.ts --check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      # Chromium is needed from here on: browser unit tests (WebGL), e2e and Lighthouse.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm budgets
      # The Worker bundle compiles and fits (no upload, no credentials needed).
      - run: pnpm exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: pnpm test:e2e
      - run: pnpm lighthouse
      # Lighthouse and Playwright reports stay available for every run, not only failures.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
      - run: pnpm audit --prod --audit-level high
